services:
  # Full-Stack Web Service (Frontend + Backend API)
  - type: web
    name: smart-tourism
    runtime: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
